<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug SW</title>
<style>
    body { font-family: monospace; padding: 16px; font-size: 13px; white-space: pre-wrap; word-break: break-all; background:#111; color:#0f0; line-height: 1.5; }
    .erro { color: #f55; }
    .ok { color: #5f5; }
</style>
</head>
<body>
<button onclick="limparLog()" style="font-family:monospace; background:#333; color:#0f0; border:1px solid #0f0; padding:8px 16px; margin-bottom:10px;">Limpar log</button>
<div id="out">Carregando...</div>
<script>
async function run() {
    const linhas = [];
    const add = (t) => linhas.push(t);

    add('--- Service Worker ---');
    if (!('serviceWorker' in navigator)) {
        add('API serviceWorker não suportada neste navegador.');
    } else {
        const regs = await navigator.serviceWorker.getRegistrations();
        add(`Registros encontrados: ${regs.length}`);
        for (const reg of regs) {
            add(`  scope: ${reg.scope}`);
            add(`  installing: ${reg.installing ? reg.installing.scriptURL : '-'}`);
            add(`  waiting: ${reg.waiting ? reg.waiting.scriptURL : '-'}`);
            add(`  active: ${reg.active ? reg.active.scriptURL + ' (state=' + reg.active.state + ')' : '-'}`);
        }
    }

    add('');
    add('--- Caches existentes ---');
    let keys = [];
    try {
        keys = await caches.keys();
        add(JSON.stringify(keys));
    } catch (e) {
        add('ERRO ao listar caches: ' + e.message);
    }

    for (const key of keys) {
        try {
            const cache = await caches.open(key);
            const reqs = await cache.keys();
            add('');
            add(`--- Conteúdo de "${key}" (${reqs.length} itens) ---`);
            const urls = reqs.map(r => r.url);
            urls.forEach(u => add('  ' + u));

            if (key.indexOf('aden-rpg-assets') !== -1) {
                const temOffline = urls.some(u => u.endsWith('/offline.html'));
                const temOfflineWebp = urls.some(u => u.endsWith('/assets/offline.webp'));
                add('');
                add(temOffline ? '>>> offline.html: OK, está no cache' : '>>> offline.html: NÃO ESTÁ NO CACHE');
                add(temOfflineWebp ? '>>> offline.webp: OK, está no cache' : '>>> offline.webp: NÃO ESTÁ NO CACHE');
            }
        } catch (e) {
            add(`ERRO ao abrir cache "${key}": ` + e.message);
        }
    }

    add('');
    add('--- Teste direto: caches.match("/offline.html") ---');
    try {
        const resp = await caches.match('/offline.html');
        add(resp ? `Encontrado! status=${resp.status}` : 'NÃO encontrado em NENHUM cache.');
    } catch (e) {
        add('ERRO ao tentar: ' + e.message);
    }

    add('');
    add('--- Log de navegações da Service Worker (mais recentes primeiro) ---');
    try {
        const debugCache = await caches.open('aden-rpg-debug-log');
        const resp = await debugCache.match('https://internal.local/debug-log');
        if (!resp) {
            add('Nenhum log registrado ainda (a SW nunca processou uma navegação, ou o log foi limpo).');
        } else {
            const entries = await resp.json();
            if (!entries.length) {
                add('Log vazio.');
            } else {
                entries.slice().reverse().forEach(e => {
                    add(JSON.stringify(e));
                });
            }
        }
    } catch (e) {
        add('ERRO ao ler o log: ' + e.message);
    }

    document.getElementById('out').textContent = linhas.join('\n');
}

async function limparLog() {
    try {
        await caches.delete('aden-rpg-debug-log');
        alert('Log apagado. Recarregue a página.');
    } catch (e) {
        alert('Erro ao apagar: ' + e.message);
    }
}

run().catch(e => {
    document.getElementById('out').textContent = 'Erro fatal ao rodar diagnóstico:\n' + e.message + '\n' + (e.stack || '');
});
</script>
</body>
</html>
